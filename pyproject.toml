[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logtensor"
version = "0.1.0"
description = "Geometric tensor transformers — guidance-system-inspired attention mechanics"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "LOG-Tensor Research Team"},
]
keywords = [
    "transformer",
    "geometric-algebra",
    "tensor-decomposition",
    "attention-mechanism",
    "proportional-navigation",
    "equivariant",
    "permutation",
    "clifford-algebra",
    "guidance-system",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
scipy = ["scipy>=1.7.0"]
reports = ["reportlab>=3.6.0"]
research = [
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
]
full = [
    "torch>=2.0.0",
    "scipy>=1.7.0",
    "reportlab>=3.6.0",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/SuperInstance/logtensor"
Repository = "https://github.com/SuperInstance/logtensor"
Issues = "https://github.com/SuperInstance/logtensor/issues"

[tool.setuptools.packages.find]
include = ["logtensor*"]
